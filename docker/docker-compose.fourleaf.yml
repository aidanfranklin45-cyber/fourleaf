services:
  ###############################################################################
  # Init
  # Prepares the host directories bind-mounted into services running as uid 1000.
  ###############################################################################
  init:
    image: alpine:3
    user: root
    network_mode: none
    command: sh -c 'mkdir -p /mnt/uploads && chown -R 1000:1000 /mnt/uploads'
    volumes:
      - ../data/uploads:/mnt/uploads:z

  ###############################################################################
  # Redis
  ###############################################################################
  redis:
    image: redis:7.4-bookworm
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 128m
    expose:
      - '6379'
    volumes:
      - ../data/redis:/data:z
    command:
      [
        'sh',
        '-c',
        'docker-entrypoint.sh --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --loglevel warning --maxmemory 32mb --maxmemory-policy allkeys-lru'
      ]
    networks:
      - net

  ###############################################################################
  # Reverse Proxy (Caddy)
  ###############################################################################
  reverse-proxy:
    image: caddy:latest
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 256m
    command: caddy run --resume --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - '${MRE_HTTP_PORT:-80}:80'
      - '${MRE_HTTPS_PORT:-443}:443'
    networks:
      - net
      - egress

  ###############################################################################
  # Gateway
  ###############################################################################
  gateway:
    restart: unless-stopped
    image: 'ghcr.io/microrealestate/microrealestate/gateway:${MRE_VERSION:-latest}'
    mem_limit: 192m
    memswap_limit: 384m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=128
      LOGGER_LEVEL: info
      PORT: 8080
      TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
      AUTHENTICATOR_URL: http://authenticator:8000
      API_URL: http://api:8200/api/v2
      PDFGENERATOR_URL: http://pdfgenerator:8300/pdfgenerator
      EMAILER_URL: http://emailer:8400/emailer
      TENANTAPI_URL: http://tenantapi:8250/tenantapi
      LANDLORD_FRONTEND_URL: http://landlord-frontend:8180
      TENANT_FRONTEND_URL: http://tenant-frontend:8190
    expose:
      - '8080'
    depends_on:
      authenticator:
        condition: service_started
      pdfgenerator:
        condition: service_started
      emailer:
        condition: service_started
      api:
        condition: service_started
      tenantapi:
        condition: service_started
    networks:
      - net

  ###############################################################################
  # Authenticator
  ###############################################################################
  authenticator:
    restart: unless-stopped
    image: 'ghcr.io/microrealestate/microrealestate/authenticator:${MRE_VERSION:-latest}'
    mem_limit: 192m
    memswap_limit: 384m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=128
      LOGGER_LEVEL: info
      PORT: 8000
      TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
      REDIS_URL: redis://redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET is required}
      RESET_TOKEN_SECRET: ${RESET_TOKEN_SECRET:?RESET_TOKEN_SECRET is required}
      MONGO_URL: ${MONGO_URL:?MONGO_URL is required}
      EMAILER_URL: http://emailer:8400/emailer
    expose:
      - '8000'
    depends_on:
      redis:
        condition: service_started
      emailer:
        condition: service_started
    networks:
      - net
      - egress

  ###############################################################################
  # PDFGenerator
  ###############################################################################
  pdfgenerator:
    restart: unless-stopped
    image: 'ghcr.io/microrealestate/microrealestate/pdfgenerator:${MRE_VERSION:-latest}'
    mem_limit: 384m
    memswap_limit: 768m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
      LOGGER_LEVEL: info
      PORT: 8300
      MONGO_URL: ${MONGO_URL:?MONGO_URL is required}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}
      CIPHER_KEY: ${CIPHER_KEY:?CIPHER_KEY is required}
      CIPHER_IV_KEY: ${CIPHER_IV_KEY:?CIPHER_IV_KEY is required}
    volumes:
      - ../data/uploads:/usr/app/services/pdfgenerator/uploads:z
    expose:
      - '8300'
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - net
      - egress

  ###############################################################################
  # Emailer
  ###############################################################################
  emailer:
    restart: unless-stopped
    image: 'ghcr.io/microrealestate/microrealestate/emailer:${MRE_VERSION:-latest}'
    mem_limit: 192m
    memswap_limit: 384m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=128
      LOGGER_LEVEL: info
      PORT: 8400
      MONGO_URL: ${MONGO_URL:?MONGO_URL is required}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-access_token_secret}
      CIPHER_KEY: ${CIPHER_KEY:-cipher_key}
      CIPHER_IV_KEY: ${CIPHER_IV_KEY:-cipher_iv_key}
      PDFGENERATOR_URL: http://pdfgenerator:8300/pdfgenerator
    expose:
      - '8400'
    depends_on:
      pdfgenerator:
        condition: service_started
    networks:
      - net
      - egress

  ###############################################################################
  # API
  ###############################################################################
  api:
    restart: unless-stopped
    image: 'ghcr.io/microrealestate/microrealestate/api:${MRE_VERSION:-latest}'
    mem_limit: 256m
    memswap_limit: 512m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
      LOGGER_LEVEL: info
      PORT: 8200
      MONGO_URL: ${MONGO_URL:?MONGO_URL is required}
      EMAILER_URL: http://emailer:8400/emailer
      PDFGENERATOR_URL: http://pdfgenerator:8300/pdfgenerator
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-access_token_secret}
      CIPHER_KEY: ${CIPHER_KEY:-cipher_key}
      CIPHER_IV_KEY: ${CIPHER_IV_KEY:-cipher_iv_key}
    expose:
      - '8200'
    depends_on:
      pdfgenerator:
        condition: service_started
      emailer:
        condition: service_started
    networks:
      - net
      - egress

  ###############################################################################
  # Tenant API
  ###############################################################################
  tenantapi:
    restart: unless-stopped
    image: 'ghcr.io/microrealestate/microrealestate/tenantapi:${MRE_VERSION:-latest}'
    mem_limit: 192m
    memswap_limit: 384m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=128
      LOGGER_LEVEL: info
      PORT: 8250
      MONGO_URL: ${MONGO_URL:?MONGO_URL is required}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}
      CIPHER_KEY: ${CIPHER_KEY:?CIPHER_KEY is required}
      CIPHER_IV_KEY: ${CIPHER_IV_KEY:?CIPHER_IV_KEY is required}
    expose:
      - '8250'
    networks:
      - net
      - egress

  ###############################################################################
  # Landlord Frontend
  ###############################################################################
  landlord-frontend:
    restart: unless-stopped
    image: 'ghcr.io/microrealestate/microrealestate/landlord-frontend:${MRE_VERSION:-latest}'
    mem_limit: 192m
    memswap_limit: 384m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=160
      PORT: 8180
      GATEWAY_URL: http://gateway:8080
      MRE_VERSION: ${MRE_VERSION:-}
    expose:
      - '8180'
    depends_on:
      gateway:
        condition: service_started
    networks:
      - net

  ###############################################################################
  # Tenant Frontend
  ###############################################################################
  tenant-frontend:
    restart: unless-stopped
    image: 'ghcr.io/microrealestate/microrealestate/tenant-frontend:${MRE_VERSION:-latest}'
    mem_limit: 192m
    memswap_limit: 384m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=160
      PORT: 8190
      GATEWAY_URL: http://gateway:8080
      MRE_VERSION: ${MRE_VERSION:-}
    expose:
      - '8190'
    depends_on:
      gateway:
        condition: service_started
    networks:
      - net

###############################################################################
# Networks
###############################################################################
networks:
  net:
    driver: bridge
    internal: true
  egress:
    driver: bridge

###############################################################################
# Volumes
###############################################################################
volumes:
  caddy_data:
  caddy_config:
